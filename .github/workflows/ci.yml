name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude kraken-client --all-targets -- -D warnings
      - run: cargo clippy -p kraken-client --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --exclude kraken-client
      - run: python3 replica/design/tokens.py
