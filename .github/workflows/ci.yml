name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une seule exécution à la fois par branche : un push plus récent annule l'ancien, qui ne peut
# donc pas republier `latest` après lui.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kraken
          POSTGRES_PASSWORD: kraken
          POSTGRES_DB: kraken
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kraken" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kraken:kraken@127.0.0.1:5432/kraken
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude kraken-client --all-targets -- -D warnings
      - run: cargo clippy -p kraken-client --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --exclude kraken-client
      - run: python3 replica/design/tokens.py

  # Image Docker : sur main, amd64 + arm64 publiées sur ghcr.io/<propriétaire>/kraken (latest et
  # le commit) ; sur une PR, amd64 seulement, rien de publié. Compilation croisée, pas d'émulation.
  # Seulement une fois les tests passés ; actions fixées par commit (ce job peut publier l'image).
  docker:
    needs: [rust, e2e, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Nom de l'image (propriétaire en minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kraken" >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=kraken
          cache-to: type=gha,scope=kraken,mode=max

  # install.sh de bout en bout, en mode local, avec l'image construite ici (sans ghcr.io).
  installer:
    runs-on: ubuntu-latest
    env:
      # Domaine .invalid : le téléchargement échoue toujours, l'installeur prend l'image locale.
      KRAKEN_IMAGE: kraken.invalid/kraken:ci
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck et syntaxe POSIX
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck install.sh
          dash -n install.sh
          bash --posix -n install.sh
      - uses: docker/setup-buildx-action@v3
      - name: Image locale
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.KRAKEN_IMAGE }}
          cache-from: type=gha,scope=kraken
      - name: Installation
        run: |
          echo "KRAKEN_DIR=$RUNNER_TEMP/kraken" >> "$GITHUB_ENV"
          KRAKEN_DIR="$RUNNER_TEMP/kraken" sh install.sh --local --yes
      - name: Vérifications, puis un compte créé avant la relance
        run: |
          set -eu
          port=$(sed -n 's/^KRAKEN_HTTP_PORT=//p' "$KRAKEN_DIR/.env")
          base="http://127.0.0.1:${port:-80}"
          echo "BASE=$base" >> "$GITHUB_ENV"
          test "$(curl -fsS "$base/api/v1/health")" = ok
          curl -fsS "$base/" | grep -q '<title>KRAKEN</title>'
          test "$(stat -c %a "$KRAKEN_DIR/.env")" = 600
          grep -Eq '^POSTGRES_PASSWORD=[A-Za-z0-9]{32,}$' "$KRAKEN_DIR/.env"
          sha256sum "$KRAKEN_DIR/.env" > "$RUNNER_TEMP/env.sha256"
          curl -fsS -o /dev/null -H 'Content-Type: application/json' \
            -d '{"username":"ci_test","email":"ci@example.invalid","password":"mot-de-passe-ci-123"}' \
            "$base/api/v1/auth/register"
      - name: Relance (mise à jour)
        run: sh install.sh --local --yes
      - name: Après la relance, .env intact et le compte toujours là
        run: |
          set -eu
          sha256sum -c "$RUNNER_TEMP/env.sha256"
          test "$(curl -fsS "$BASE/api/v1/health")" = ok
          curl -fsS -o /dev/null -H 'Content-Type: application/json' \
            -d '{"login":"ci_test","password":"mot-de-passe-ci-123"}' "$BASE/api/v1/auth/login"
      - if: failure()
        run: |
          if [ -f "$KRAKEN_DIR/.env" ]; then cd "$KRAKEN_DIR"; docker compose ps -a; docker compose logs --tail 200; fi

  # install.ps1 : analyse par PowerShell, puis plan sans rien installer (-DryRun), en Windows
  # PowerShell 5.1 et en PowerShell 7, comme fichier et comme avec irm | iex.
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("ligne {0} : {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -DryRun -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:KRAKEN_DRY_RUN = '1'
          Get-Content -Raw -Encoding UTF8 .\install.ps1 | Invoke-Expression
      - name: PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("ligne {0} : {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            $issues = Invoke-ScriptAnalyzer -Path .\install.ps1 -Severity Error
            if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          }
          pwsh -NoProfile -File .\install.ps1 -DryRun -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:KRAKEN_DRY_RUN = '1'
          Get-Content -Raw .\install.ps1 | Invoke-Expression

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kraken
          POSTGRES_PASSWORD: kraken
          POSTGRES_DB: kraken
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kraken" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kraken:kraken@127.0.0.1:5432/kraken
      KRAKEN_AUTH_PER_MIN: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - run: ./scripts/build-client.sh
      - run: cargo build -p kraken-server
      - name: Lancer le serveur avec les données de démo
        run: |
          nohup ./target/debug/kraken-server --seed > server.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e/playwright-report
            server.log
