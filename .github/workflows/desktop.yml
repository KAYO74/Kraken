name: desktop
# Appli de bureau (Tauri) pour Windows, macOS et Linux. Sur main (ou une étiquette v*), publie la
# Release de la version de apps/desktop/Cargo.toml si elle n'existe pas encore.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build-client.sh', 'replica/design/**',
      'replica/brand/icons/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build-client.sh', 'replica/design/**',
      'replica/brand/icons/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux, target: '' }
          - { os: windows-latest, name: windows, target: '' }
          - { os: macos-latest, name: macos, target: universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            .
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      # Le client web est livré dans l'appli (mode « héberger ») : à construire avant.
      - name: Client web
        shell: bash
        run: sh scripts/build-client.sh release
      - run: npm install -g @tauri-apps/cli@2
      - name: tauri build
        working-directory: apps/desktop
        shell: bash
        run: tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      # PostgreSQL et le serveur démarrent pour de vrai, avec le client livré dans le paquet.
      - name: Self-test
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          cd apps/desktop/target
          case "$RUNNER_OS" in
            Linux)
              dpkg-deb -x release/bundle/deb/*.deb "$RUNNER_TEMP/deb"
              for bin in "$RUNNER_TEMP"/deb/usr/bin/*; do "$bin" --self-test; done
              ;;
            Windows)
              release/kraken-desktop.exe --self-test
              ;;
            macOS)
              for bin in universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/*; do
                "$bin" --self-test
                # La tranche Intel aussi, si Rosetta est là.
                if arch -x86_64 /usr/bin/true 2> /dev/null; then arch -x86_64 "$bin" --self-test; fi
              done
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/target/**/release/bundle/deb/*.deb
            apps/desktop/target/**/release/bundle/rpm/*.rpm
            apps/desktop/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/target/**/release/bundle/msi/*.msi
            apps/desktop/target/**/release/bundle/nsis/*.exe
            apps/desktop/target/**/release/bundle/dmg/*.dmg

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' apps/desktop/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists != '1'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Notes de la version (docs/releases/<tag>.md, si le fichier existe), puis l'installation.
      - if: steps.version.outputs.exists != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; echo '## Installer'; echo; fi > "$notes"
          cat >> "$notes" <<'EOF'
          KRAKEN de bureau : au premier lancement, rejoins un serveur (son adresse ou un lien d'invitation) ou héberge le tien sur cet ordinateur en un clic.

          - Windows : `.msi` ou `-setup.exe`
          - macOS (Intel et Apple Silicon) : `.dmg`
          - Linux : `.AppImage`, `.deb` (Debian, Ubuntu) ou `.rpm` (Fedora)

          Les installateurs ne sont pas encore signés : Windows affiche un avertissement SmartScreen (« Informations complémentaires », puis « Exécuter quand même ») et macOS bloque le premier lancement : Réglages Système, Confidentialité et sécurité, « Ouvrir quand même ».
          EOF
      - if: steps.version.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KRAKEN ${{ steps.version.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
