name: desktop
# Appli de bureau (Tauri) pour Windows, macOS et Linux. Sur main (ou une étiquette v*), publie la
# Release de la version de apps/desktop/Cargo.toml si elle n'existe pas encore.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build-client.sh', 'replica/design/**',
      'replica/brand/icons/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build-client.sh', 'replica/design/**',
      'replica/brand/icons/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux, target: '' }
          - { os: windows-latest, name: windows, target: '' }
          # Un .dmg par puce : Apple (M1, M2…) et Intel, chacun construit et testé sur sa puce.
          - { os: macos-latest, name: macos-apple, target: aarch64-apple-darwin }
          - { os: macos-15-intel, name: macos-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    # Clé de signature des mises à jour (secrets du dépôt) ; absente, les paquets ne sont pas signés.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            .
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      # Le client web est livré dans l'appli (mode « héberger ») : à construire avant.
      - name: Client web
        shell: bash
        run: sh scripts/build-client.sh release
      - run: npm install -g @tauri-apps/cli@2
      # Mises à jour dans l'appli : paquets signés (.sig) seulement si le secret de signature existe ;
      # sans lui, la construction reste la même et l'appli propose un téléchargement à la main.
      - name: tauri build
        working-directory: apps/desktop
        shell: bash
        run: |
          set -eu
          config=""
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater-config.json
            config="--config updater-config.json"
          fi
          tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} $config
      # PostgreSQL et le serveur démarrent pour de vrai, avec le client livré dans le paquet.
      - name: Self-test
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          cd apps/desktop/target
          case "$RUNNER_OS" in
            Linux)
              dpkg-deb -x release/bundle/deb/*.deb "$RUNNER_TEMP/deb"
              for bin in "$RUNNER_TEMP"/deb/usr/bin/*; do "$bin" --self-test; done
              ;;
            Windows)
              release/kraken-desktop.exe --self-test
              ;;
            macOS)
              for bin in ${{ matrix.target }}/release/bundle/macos/*.app/Contents/MacOS/*; do
                # Rien de Homebrew : absent des Mac des gens, l'appli n'y démarrerait pas.
                if otool -L "$bin" | grep -E '/opt/homebrew|/usr/local'; then echo "$bin dépend de Homebrew"; exit 1; fi
                "$bin" --self-test
              done
              ;;
          esac
      # Paquets de mise à jour sous leurs noms fixes (Release) : l'.app.tar.gz de macOS, et la
      # signature (.sig) de l'installateur NSIS (Windows) ou de l'AppImage (Linux), qui servent eux-mêmes.
      - name: Paquets de mise à jour
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -eu
          b=apps/desktop/target
          mkdir -p "$b/updater"
          one() { f=$(ls $1 | head -1); test -f "$f"; cp "$f" "$b/updater/$2"; }
          case "$RUNNER_OS" in
            Linux) one "$b/release/bundle/appimage/*.AppImage.sig" KRAKEN-Linux.AppImage.sig ;;
            Windows) one "$b/release/bundle/nsis/*-setup.exe.sig" KRAKEN-Windows.exe.sig ;;
            macOS)
              n=${{ matrix.target == 'aarch64-apple-darwin' && 'Apple' || 'Intel' }}
              one "$b/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz" "KRAKEN-macOS-$n.app.tar.gz"
              one "$b/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig" "KRAKEN-macOS-$n.app.tar.gz.sig"
              ;;
          esac
          ls "$b/updater"
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/target/updater/*
            apps/desktop/target/**/release/bundle/deb/*.deb
            apps/desktop/target/**/release/bundle/rpm/*.rpm
            apps/desktop/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/target/**/release/bundle/msi/*.msi
            apps/desktop/target/**/release/bundle/nsis/*.exe
            apps/desktop/target/**/release/bundle/dmg/*.dmg
      # La commande du README, comme chez quelqu'un : le .dmg de sa puce dans Téléchargements, en
      # quarantaine et déjà ouvert par Safari, zsh, sans Homebrew ; l'appli doit démarrer et rester ouverte.
      - name: Installation macOS (commande du README)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        run: |
          set -eu
          chip=${{ matrix.target == 'aarch64-apple-darwin' && 'Apple' || 'Intel' }}
          dmg=~/Downloads/KRAKEN-macOS-$chip.dmg
          cp apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$dmg"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$dmg"
          hdiutil attach -quiet "$dmg"
          awk -v m="Puce $chip" 'index($0, m) == 1 {f = 1} f && /^```sh/ {g = 1; next} g && /^```/ {exit} g' README.md > "$RUNNER_TEMP/cmd.sh"
          cat "$RUNNER_TEMP/cmd.sh"
          test -s "$RUNNER_TEMP/cmd.sh"
          hidden=""
          for d in /opt/homebrew /usr/local/opt /usr/local/Cellar; do
            if [ -e "$d" ]; then sudo mv "$d" "$d.off"; hidden="$hidden $d"; fi
          done
          trap 'for d in $hidden; do sudo mv "$d.off" "$d"; done' EXIT
          zsh -c "$(cat "$RUNNER_TEMP/cmd.sh")"
          sleep 15
          if ! pgrep -f /Applications/KRAKEN.app/Contents/MacOS/ > /dev/null; then
            echo "KRAKEN ne tourne pas"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/ | head -1)
            [ -n "$f" ] && head -c 3000 ~/Library/Logs/DiagnosticReports/"$f"
            exit 1
          fi
          if xattr -lr /Applications/KRAKEN.app | grep -q quarantine; then echo "quarantaine restée"; exit 1; fi
          pkill -f /Applications/KRAKEN.app/Contents/MacOS/ || true

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' apps/desktop/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists != '1'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Un nom fixe par système : les liens .../releases/latest/download/<nom> du README restent bons.
      - if: steps.version.outputs.exists != '1'
        run: |
          mkdir out
          find dist -type f | while read -r f; do
            case "$f" in
              *_aarch64.dmg) n=KRAKEN-macOS-Apple.dmg ;;
              *_x64.dmg) n=KRAKEN-macOS-Intel.dmg ;;
              *-setup.exe) n=KRAKEN-Windows.exe ;;
              *.msi) n=KRAKEN-Windows.msi ;;
              *.AppImage) n=KRAKEN-Linux.AppImage ;;
              *.deb) n=KRAKEN-Linux.deb ;;
              *.rpm) n=KRAKEN-Linux.rpm ;;
              *) continue ;;
            esac
            mv "$f" "out/$n"
          done
          # Paquets de mise à jour (déjà sous leur nom fixe), présents si la construction était signée.
          find dist -type f -path '*/updater/*' | while read -r f; do mv "$f" "out/$(basename "$f")"; done
          ls out
          n=$(ls out | wc -l)
          if ls out/*.sig > /dev/null 2>&1; then test "$n" -eq 13; else test "$n" -eq 7; fi
      # Notes de la version (docs/releases/<tag>.md, si le fichier existe), puis comment installer.
      - if: steps.version.outputs.exists != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; fi > "$notes"
          sed "s/@TAG@/$TAG/g" docs/releases/installer.md >> "$notes"
      # latest.json : ce que lit l'appli (tauri-plugin-updater). Seulement si les paquets sont signés.
      - if: steps.version.outputs.exists != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ls out/*.sig > /dev/null 2>&1; then
            python3 - <<'PY'
          import json, os, datetime
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          sig = lambda n: open(f"out/{n}.sig").read().strip()
          # Plateforme -> fichier à télécharger (sa signature : <fichier>.sig).
          files = {
              "darwin-aarch64": "KRAKEN-macOS-Apple.app.tar.gz",
              "darwin-x86_64": "KRAKEN-macOS-Intel.app.tar.gz",
              "windows-x86_64": "KRAKEN-Windows.exe",
              "linux-x86_64": "KRAKEN-Linux.AppImage",
          }
          notes = ""
          if os.path.exists(f"docs/releases/{tag}.md"):
              notes = open(f"docs/releases/{tag}.md").read().strip()
          data = {
              "version": tag.lstrip("v"),
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {p: {"signature": sig(n), "url": f"{base}/{n}"} for p, n in files.items()},
          }
          json.dump(data, open("out/latest.json", "w"), indent=2, ensure_ascii=False)
          PY
            cat out/latest.json
          fi
      - if: steps.version.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KRAKEN ${{ steps.version.outputs.tag }}
          files: out/*
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
