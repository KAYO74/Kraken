# Instance KRAKEN auto-hébergée : `cp .env.example .env`, remplir, puis `docker compose up -d`.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kraken
      POSTGRES_DB: kraken
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraken"]
      interval: 5s
      retries: 10

  kraken:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kraken:${POSTGRES_PASSWORD}@db/kraken
      KRAKEN_PUBLIC_URL: ${KRAKEN_PUBLIC_URL:-http://localhost:8080}
      KRAKEN_SMTP_URL: ${KRAKEN_SMTP_URL:-}
      KRAKEN_SMTP_FROM: ${KRAKEN_SMTP_FROM:-}
      KRAKEN_TRUST_PROXY: ${KRAKEN_TRUST_PROXY:-0}
      KRAKEN_AUTH_PER_MIN: ${KRAKEN_AUTH_PER_MIN:-20}
    ports:
      - "8080:8080"

volumes:
  db:
