# Instance KRAKEN auto-hébergée. Le plus simple : `sh install.sh` (pose les questions, écrit .env,
# démarre tout). À la main : `cp .env.example .env`, remplir, puis `docker compose up -d`.
# Avec un domaine, Caddy sert l'instance en HTTPS (certificat Let's Encrypt automatique) ; sans
# domaine, en HTTP simple sur le réseau local. Seul Caddy est exposé.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kraken
      POSTGRES_DB: kraken
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraken"]
      interval: 5s
      retries: 10

  kraken:
    # Image publiée par la CI (amd64 et arm64). Si elle est introuvable, compose la construit
    # depuis le code source (dans un clone du dépôt seulement).
    image: ${KRAKEN_IMAGE:-ghcr.io/kayo74/kraken:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Le mot de passe passe à part : dans l'URL, un `/`, `#` ou `%` la casserait.
      DATABASE_URL: postgres://kraken@db/kraken
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Pas de `:?` dans une valeur par défaut imbriquée : Compose 2.x l'évaluerait toujours.
      KRAKEN_PUBLIC_URL: ${KRAKEN_PUBLIC_URL:-https://${KRAKEN_DOMAIN}}
      KRAKEN_TRUST_PROXY: "1"
      KRAKEN_SMTP_URL: ${KRAKEN_SMTP_URL:-}
      KRAKEN_SMTP_FROM: ${KRAKEN_SMTP_FROM:-}
      KRAKEN_AUTH_PER_MIN: ${KRAKEN_AUTH_PER_MIN:-20}
      KRAKEN_CONTACT: ${KRAKEN_CONTACT:-}
      KRAKEN_PROCESSORS: ${KRAKEN_PROCESSORS:-}
      KRAKEN_SOURCE_URL: ${KRAKEN_SOURCE_URL:-}
      KRAKEN_SEED: ${KRAKEN_SEED:-}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - kraken
    environment:
      # Le domaine (HTTPS), ou `http://` sans domaine : HTTP simple, quelle que soit l'adresse.
      KRAKEN_SITE: ${KRAKEN_DOMAIN:-http://}
    ports:
      - "${KRAKEN_HTTP_PORT:-80}:80"
      - "${KRAKEN_HTTPS_PORT:-443}:443"
      - "${KRAKEN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  # Sauvegarde quotidienne de la base dans ./backups, gardée 14 jours.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: kraken
      PGDATABASE: kraken
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - while true; do pg_dump -Fc -f /backups/kraken-$$(date +%F).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done

volumes:
  db:
  caddy:
