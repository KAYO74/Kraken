[package]
name = "kraken-client"
description = "Client KRAKEN (Leptos, WASM) : web, puis desktop et mobile via Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kraken-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "Location", "Navigator", "Clipboard", "HtmlInputElement"] }
futures = "0.3"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
icondata_core = "0.1"
icondata_lu = "0.1"
