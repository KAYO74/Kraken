[package]
name = "kraken-client"
description = "Client KRAKEN (Leptos, WASM) : web, puis desktop et mobile via Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kraken-proto.workspace = true
kraken-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Storage", "Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "Location", "Navigator", "Clipboard",
    "HtmlInputElement", "HtmlDocument", "MediaQueryList",
    # Messages : saisie (curseur, autocomplétion), saut vers un message.
    "HtmlTextAreaElement", "Node", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollBehavior",
    # Salons vocaux : WebRTC, micro, partage d'écran.
    "RtcPeerConnection", "RtcConfiguration", "RtcBundlePolicy", "RtcPeerConnectionState", "RtcRtpTransceiver",
    "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection", "RtcRtpSender", "RtcDataChannel", "RtcDataChannelState",
    "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType", "RtcTrackEvent", "MessageEvent",
    "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamTrackState", "MediaStreamConstraints",
    "DisplayMediaStreamConstraints", "HtmlMediaElement", "HtmlVideoElement", "HtmlAudioElement",
    "AudioContext", "BaseAudioContext", "AudioNode", "AnalyserNode", "MediaStreamAudioSourceNode",
    # Contrôle à distance : souris, molette, clavier sur l'écran regardé ; réglages de la piste.
    "PointerEvent", "MouseEvent", "WheelEvent", "FocusEvent", "DomRect", "MediaTrackSettings",
] }
futures = "0.3"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
icondata_core = "0.1"
icondata_lu = "0.1"
