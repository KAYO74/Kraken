[package]
name = "kraken-db"
description = "Couche données : PostgreSQL via sqlx, migrations, file de tâches"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kraken-proto.workspace = true
kraken-core.workspace = true
uuid.workspace = true
serde_json.workspace = true
rand = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
