[package]
name = "kraken-server"
description = "Serveur KRAKEN : REST, gateway WebSocket, fichiers statiques du client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kraken-proto.workspace = true
kraken-core.workspace = true
kraken-db.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
