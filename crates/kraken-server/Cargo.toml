[package]
name = "kraken-server"
description = "Serveur KRAKEN : REST, gateway WebSocket, tâches de fond, fichiers statiques du client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kraken-proto.workspace = true
kraken-core.workspace = true
kraken-db.workspace = true
kraken-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
governor = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
# Aperçus de liens : client HTTP à la main (hyper + rustls), pour choisir nous-mêmes l'adresse
# où l'on se connecte (voir `fetch.rs`).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream"] }
tokio-tungstenite = "0.27"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
# Un « navigateur » WebRTC pour les tests du vocal.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
